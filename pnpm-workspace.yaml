packages:
  - "packages/*"

# 公開から 14 日（20160 分）未満の版は、依存の解決で選ばない（新しい版の混入・供給網の攻撃への備え）。
minimumReleaseAge: 20160

# Agent SDK の推移的な依存のうち、公開から 14 日未満だった版を、14 日以上前の版に固定する（2026-10-21 に確認）。
# 既知の脆弱性（#15）を直した版のうち、公開から 14 日以上たったものへ上げる（2026-11-14 に確認）: body-parser・fast-uri・ip-address・qs・node-forge（開発だけ）。
overrides:
  "@hono/node-server": "2.1.3"
  "@opentelemetry/api": "1.9.1"
  body-parser: "2.4.0"
  express: "5.2.1"
  fast-uri: "3.1.9"
  ip-address: "10.7.5"
  jose: "6.2.12"
  node-forge: "1.4.2"
  qs: "6.16.2"
