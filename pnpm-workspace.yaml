packages:
  - "packages/*"

# 公開から 14 日（20160 分）未満の版は、依存の解決で選ばない（新しい版の混入・供給網の攻撃への備え）。
minimumReleaseAge: 20160
# 弱点の直し（#51）のため、この 1 版だけを例外にする（2026-11-16 に確かめた: provenance が上流の v2.1.6 の tag と一致、公開した人は前の版と同じ、
# 2.1.5 との差は弱点の直しと版の変更だけ、install の script と依存の変わりはない）。2026-11-16T10:22:05Z に 14 日を過ぎるので、そのあとに消す。
minimumReleaseAgeExclude:
  - "@hono/node-server@2.1.6"

# Agent SDK の推移的な依存のうち、公開から 14 日未満だった版を、14 日以上前の版に固定する（2026-10-21 に確認）。
# 既知の脆弱性（#15）を直した版のうち、公開から 14 日以上たったものへ上げる（2026-11-14 に確認）: body-parser・fast-uri・ip-address・qs・node-forge（開発だけ）。
# 既知の脆弱性（#51）を直した版のうち、公開から 14 日以上たったものへ上げる（2026-11-16 に確認）: hono・@hono/node-server。
overrides:
  "@hono/node-server": "2.1.6"
  "@opentelemetry/api": "1.9.1"
  body-parser: "2.4.0"
  express: "5.2.1"
  fast-uri: "3.1.9"
  hono: "4.13.16"
  ip-address: "10.7.5"
  jose: "6.2.12"
  node-forge: "1.4.2"
  qs: "6.16.2"
