<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>状態画面 第 5 弾 最終提案（マットオーロラ版）</title>
<style>
/* グラスモーフィズムの基本変数（ライトモード：白木と朝焼けの和紙） */
:root {
  --glass-bg: rgba(244, 241, 234, 0.25);
  --glass-border: rgba(255, 255, 255, 0.45);
  --glass-blur: blur(16px);
  --glass-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
  --solid-bg: #f4f1ea;
  
  --ink: #1d1f22; 
  --ink2: #555a60;
  --rule: rgba(214, 211, 200, 0.55);
  --grid: #e8e5da;
  --accent: #2a5fa8;
  --kaki: #b04a00;
  --kaki-soft: rgba(251, 230, 210, 0.6);
  --matsu: #2c6b44;
  --matsu-soft: rgba(220, 235, 223, 0.6);
  --shu: #a3261c;
  --shu-soft: rgba(247, 223, 219, 0.6);
  --kiiro: #7a5c00;
  --kiiro-soft: rgba(243, 235, 198, 0.6);
  --on: #fff;
  --wire: #2a5fa8;
  --wire-over: #c4c2b8;
  --blue: #2a5fa8;
  --cyan: #0b6e69;
  --violet: #6a43b0;
  --bar: 60px;
  --hd: 52px;
  --rad: 8px;
}

/* ダークモード：使い込まれた柱と宵の作業場 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass-bg: rgba(22, 20, 18, 0.45);
  --glass-border: rgba(255, 245, 235, 0.12);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
  --solid-bg: #1c1917;
  
  --ink: #edeae6;
  --ink2: #a8a29e;
  --rule: rgba(68, 64, 60, 0.55);
  --grid: #292524;
  --accent: #7fb0ee;
  --kaki: #ffa04a;
  --kaki-soft: rgba(67, 40, 18, 0.6);
  --matsu: #7fc495;
  --matsu-soft: rgba(24, 52, 34, 0.6);
  --shu: #ff8c80;
  --shu-soft: rgba(69, 28, 24, 0.6);
  --kiiro: #dcbc4c;
  --kiiro-soft: rgba(56, 46, 18, 0.6);
  --on: #12100e;
  --wire: #7fb0ee;
  --wire-over: #44403c;
  --blue: #7fb0ee;
  --cyan: #5fe0d6;
  --violet: #b49cff;
  color-scheme:dark;scrollbar-color:#44403c transparent;
}}

:root[data-theme="dark"]{
  --glass-bg: rgba(22, 20, 18, 0.45);
  --glass-border: rgba(255, 245, 235, 0.12);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
  --solid-bg: #1c1917;
  
  --ink: #edeae6;
  --ink2: #a8a29e;
  --rule: rgba(68, 64, 60, 0.55);
  --grid: #292524;
  --accent: #7fb0ee;
  --kaki: #ffa04a;
  --kaki-soft: rgba(67, 40, 18, 0.6);
  --matsu: #7fc495;
  --matsu-soft: rgba(24, 52, 34, 0.6);
  --shu: #ff8c80;
  --shu-soft: rgba(69, 28, 24, 0.6);
  --kiiro: #dcbc4c;
  --kiiro-soft: rgba(56, 46, 18, 0.6);
  --on: #12100e;
  --wire: #7fb0ee;
  --wire-over: #44403c;
  --blue: #7fb0ee;
  --cyan: #5fe0d6;
  --violet: #b49cff;
  color-scheme:dark;scrollbar-color:#44403c transparent;
}

/* WebGL/Canvas マットオーロラ背景（最背面） */
#aurora-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  pointer-events: none;
  filter: blur(75px);
  transform: scale(1.15);
}

html, body {
  background: transparent;
  color: var(--ink);
  margin: 0;
  font: 15px/1.7 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
}
body {
  padding-bottom: calc(var(--bar) + 16px + env(safe-area-inset-bottom));
}

/* すりガラスUI（グラスモーフィズム） */
.win, .card, .task, .cmd, .legend, .lgw, dialog, .top, .wt, .nav {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
.win { border-radius: var(--rad); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.card, .task, .cmd, .legend, .lgw { border-radius: var(--rad); }
.top { border-bottom: 1px solid var(--glass-border); border-left: none; border-right: none; border-top: none; border-radius: 0; box-shadow: none; }
.wt { border-bottom: 1px solid var(--glass-border); border-left: none; border-right: none; border-top: none; border-radius: 0; box-shadow: none; }
.nav { border-top: 1px solid var(--glass-border); border-left: none; border-right: none; border-bottom: none; border-radius: 0; box-shadow: none; }
.wh { border-bottom: 1px solid var(--rule); }

/* 図の中のノードと札は視認性のため不透明（ソリッド）にする */
.nd .box {
  fill: var(--solid-bg);
  stroke: var(--rule);
  stroke-width: 1.2;
}
.pill.tag {
  fill: var(--solid-bg);
  stroke: var(--c);
  stroke-width: 1;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1680px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--solid-bg);padding:10px 14px;border:2px solid var(--accent);border-radius:8px;z-index:30}
.skip:focus{top:8px}
a{color:var(--accent)}
.wh h2,.wm,.chip,.pipe li span{font-family:Menlo,Consolas,"SF Mono",monospace}
.btn{font:inherit;font-size:15px;min-height:48px;min-width:48px;padding:8px 18px;border-radius:var(--rad);border:1px solid var(--rule);background:var(--solid-bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--kaki);border-color:var(--kaki);color:var(--on);font-weight:700}
.btn.done{background:var(--matsu);border-color:var(--matsu);color:var(--on)}
.btn.wide{width:100%}
.pconly{display:none}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:var(--hd);padding:0;line-height:1.2}
.top h1{font-size:14px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Menlo,Consolas,monospace;letter-spacing:.06em;font-weight:500}
.top .btn{min-height:36px;min-width:36px;padding:0 12px;font-size:13px;white-space:nowrap}
.top h1{flex:0 1 auto}.top .conn{margin-right:auto}
.conn{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--matsu);animation:breathe 2.4s ease-in-out infinite}
.conn.off{color:var(--shu);font-weight:700}.conn.off i{background:var(--shu);animation:none}
.lostbar{margin:10px 0;padding:10px 14px;border:2px solid var(--shu);background:var(--shu-soft);color:var(--shu);border-radius:var(--rad);font-size:14px}
.lostbar.example{margin:10px 0 0}
.lead{margin:0 0 10px;color:var(--ink2);font-size:13.5px}
.hint,.empty{color:var(--ink2);font-size:13.5px}
.empty{padding:14px;border:1px dashed var(--rule);border-radius:var(--rad)}

.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;}
.wh h2{margin:0;font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--accent)}
.wm{font-size:12px;color:var(--ink2)}
.wb{padding:12px 14px;overflow:auto;min-height:0;flex:1}
.wt{display:flex;}
.wtab{flex:1;font:inherit;font-size:13px;min-height:32px;padding:0 8px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.wtab:hover{color:var(--ink)}
.wtab[aria-selected="true"]{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
.bdg{min-width:20px;height:20px;border-radius:10px;background:var(--kaki);color:var(--on);font-size:12px;font-weight:800;display:inline-grid;place-items:center;padding:0 5px}
.wtab .bdg{min-width:16px;height:16px;border-radius:8px;font-size:11px;line-height:1;padding:0 4px}
.todo{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;grid-auto-rows:1fr;align-items:stretch}
.task{align-content:start; border-left:3px solid var(--kaki); padding:12px 14px;display:grid;gap:8px}
.task .who,.card .hd .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task .ask,.card h3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:anywhere}
.task .ask{-webkit-line-clamp:3;line-clamp:3}
.card h3{-webkit-line-clamp:2;line-clamp:2}
.task.s-fail{border-left-color:var(--shu)}.task.s-stall{border-left-color:var(--kiiro)}
.who{font-size:13px;color:var(--ink2)}.who b{color:var(--ink)}.ask{font-size:15.5px;font-weight:700;line-height:1.6}
.task .row{display:grid;gap:8px}.task .row .btn{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cmd{display:grid;gap:8px; border:1px dashed var(--rule); padding:8px 12px}
code{font:13px/1.5 Menlo,Consolas,monospace;word-break:break-all}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:999px;line-height:1.8}
.chip.s-run{background:var(--matsu-soft);color:var(--matsu)}.chip.s-wait{background:var(--kaki-soft);color:var(--kaki)}
.chip.s-done{background:var(--grid);color:var(--ink2)}.chip.s-fail{background:var(--shu-soft);color:var(--shu)}
.chip.s-stall{background:var(--kiiro-soft);color:var(--kiiro)}.chip.s-lost{background:transparent;color:var(--shu);border:1.5px dashed var(--shu)}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:var(--rad);overflow:hidden;list-style:none;margin:12px 0 0;padding:0; background:var(--solid-bg)}
.pipe li{padding:6px 8px;display:grid;justify-items:center;border-right:1px solid var(--rule);color:var(--ink2);font-size:12px}
.pipe li:last-child{border-right:0}.pipe b{font-size:22px;font-weight:400;color:var(--ink)}.pipe li.turn{background:var(--kaki-soft);color:var(--kaki);font-weight:700}.pipe li.turn b{color:var(--kaki)}
.demo{margin-top:16px;display:grid;gap:8px;font-size:13px;color:var(--ink2)}
.samples h3{font-size:14px;margin:16px 0 4px}

.board{position:relative;background:transparent;border:1px solid var(--rule);border-radius:var(--rad);overflow:hidden}
.gz{position:absolute;top:8px;right:8px;z-index:2;display:flex;flex-direction:column;gap:4px}
.gz .btn{min-height:32px;min-width:32px;width:32px;height:32px;padding:0;display:grid;place-items:center;background:var(--solid-bg);opacity:.92}
.gz .btn:hover,.gz .btn:focus-visible{opacity:1}
.gz svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.board .zv{position:absolute;left:8px;top:6px;z-index:2;font:11px Menlo,Consolas,monospace;color:var(--ink2);pointer-events:none}
.cap{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--ink2)}
.tree{display:block;width:100%;min-width:0;height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.board.grab .tree{cursor:grabbing}
.ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
.tip{fill:var(--c);stroke:none}
.tip.chev{fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.k-ask{--c:var(--k-ask)}.k-prog{--c:var(--k-prog)}.k-fail{--c:var(--k-fail)}.k-req{--c:var(--k-req)}.k-done{--c:var(--k-done)}
.twig{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 5;opacity:.6}
.twig-m{fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-linecap:round}

/* 札のテキストの色 */
.lab{font:12.5px Menlo,Consolas,"SF Mono",monospace;font-weight:700;fill:var(--c)}
.swv{flex:none;display:block}
.nd{cursor:pointer}
.nd:hover .box,.nd:focus-visible .box,.nd.sel .box{stroke:var(--accent)}
.nd .stripe{fill:var(--matsu)}
.nd.s-wait .box{stroke:var(--kaki);stroke-width:2}.nd.s-wait .stripe{fill:var(--kaki)}
.nd.s-stall .box{stroke:var(--kiiro);stroke-width:2}.nd.s-stall .stripe{fill:var(--kiiro)}
.nd.s-fail .box{stroke:var(--shu);stroke-width:2}.nd.s-fail .stripe{fill:var(--shu)}
.nd.s-done{opacity:.55}.nd.s-done .stripe{fill:var(--wire-over)}
.nd .ttl{font-size:13px;font-weight:700;fill:var(--ink)}.nd .st{font-size:12px;font-weight:700;fill:var(--ink2)}
.nd.s-wait .st{fill:var(--kaki)}.nd.s-fail .st{fill:var(--shu)}.nd.s-stall .st{fill:var(--kiiro)}.nd.s-run .st{fill:var(--matsu)}
.nd .badge{fill:var(--kaki)}.nd .bt{font-size:12px;font-weight:800;fill:var(--on)}
.legend{border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.legend summary{cursor:pointer;padding:8px 12px;min-height:36px;display:flex;align-items:center}
.legend .lgb{display:grid;gap:4px;padding:2px 12px 10px}
.lg{display:flex;align-items:center;gap:10px}
.cards{display:grid;gap:12px}

.card .hd{padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--rule)}
.card.s-run .hd{background:var(--matsu);border-bottom-color:var(--matsu)}.card.s-run .hd .chip{background:var(--on);color:var(--matsu)}
.card.s-wait{border-color:var(--kaki)}.card.s-fail{border-color:var(--shu)}.card.s-stall{border-color:var(--kiiro)}.card.s-done{opacity:.72}
.card.flash{animation:flash 1.5s ease-out}
.need{font-size:13px;font-weight:700;color:var(--kaki)}.card.s-run .need{color:var(--on)}
.card .bd{padding:10px 14px;display:grid;gap:10px}
.kv{display:grid;border-top:1px solid var(--rule)}
.kvr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.kvr .k{color:var(--ink2)}.kvr .v{font-weight:600;text-align:right}
.prog{display:block;width:100%;height:8px}.prog .pt{fill:var(--grid)}.prog .pf{fill:var(--matsu)}
.spark{display:block;width:100%;height:36px}.spark .axis{stroke:var(--rule)}.spark .sb{fill:var(--wire)}.spark .sb.h{fill:var(--kaki)}
.flows,.hist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.flows li,.hist li{display:grid;grid-template-columns:18px 1fr;gap:6px}.flows .ar,.hist .ar{font-weight:800}.ar.up,.lgw .up{color:var(--blue)}.ar.dn,.lgw .dn{color:var(--matsu)}.flows li.h,.hist li.h{color:var(--kaki)}
.lgw{flex:none;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;padding:5px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink2);line-height:1.5}
.lgw span{display:inline-flex;align-items:center;gap:5px}.lgw b{font-size:15px;font-weight:800}
.inbox{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.inbox li{border:1px solid var(--rule);border-radius:var(--rad);padding:8px 12px;font-size:13.5px;display:grid;gap:2px; background:var(--solid-bg)}
.inbox li.h{border-color:var(--kaki)}

/* スマホの下の切り替え：2タブ（出番 / 図と作業）に集約 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(2,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nb{position:relative;font:inherit;font-size:13px;min-height:var(--bar);border:0;background:transparent;color:var(--ink2);cursor:pointer;display:grid;place-items:center;align-content:center;padding:4px}
.nb[aria-current="page"]{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--accent)}
.nb .ic{font-size:18px;line-height:1.2}
.nb .bdg{position:absolute;top:6px;left:calc(50% + 8px)}
dialog{border-radius:12px 12px 0 0;color:var(--ink);padding:18px 20px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto auto 0}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 8px;font-size:18px}
fieldset{border:0;border-top:1px solid var(--rule);margin:8px 0;padding:8px 0}legend{font-size:13.5px;color:var(--ink2);padding-right:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}.opt input{width:22px;height:22px}

@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--kaki)}30%{box-shadow:0 0 0 6px var(--kaki-soft)}100%{box-shadow:none}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes flow2{to{stroke-dashoffset:-7}}
html.still *,html.still *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== モバイル・タブレット縦向き（〜899px）===== */
@media (max-width:899px){
  :root{--hd:48px}
  .top{gap:6px}.top h1{font-size:13px;letter-spacing:.03em}
  .top .btn{min-height:44px;min-width:44px;padding:0 10px}
  .win{display:none;border:0;background:transparent;box-shadow:none;backdrop-filter:none}.win.on{display:flex}
  /* 「図と作業（explore）」モードの時は、図と作業のようすを縦に並べて同時表示 */
  body[data-view="explore"] .win[data-p="graph"],
  body[data-view="explore"] .win[data-p="right"]{display:flex}
  body[data-view="explore"] .win[data-p="right"]{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
  body[data-view="explore"] .tree{max-height:42vh;min-height:220px}
  .wh{border-bottom:0;padding:14px 0 4px}.wh h2{font-size:17px;letter-spacing:0;color:var(--ink);font-weight:700}
  .wt{background:transparent;box-shadow:none;backdrop-filter:none}
  .wtab{min-height:44px;padding:0 10px;border-bottom-width:3px;gap:6px}
  .wtab .bdg{min-width:20px;height:20px;border-radius:10px;font-size:12px;padding:0 5px}
  .wb{padding:12px 0 0;overflow:visible;flex:none}
  .gz .btn{min-height:44px;min-width:44px;width:44px;height:44px}.cap .zh{display:none}
  .lgw{position:sticky;bottom:calc(var(--bar) + env(safe-area-inset-bottom));padding-left:0;padding-right:0}
}
@media (max-width:640px){.conn .ct{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (min-width:641px) and (max-width:899px){.task .row{display:flex}.task .row .btn{width:auto}.cards{grid-template-columns:repeat(2,1fr)}.wrap{max-width:860px}}

/* ===== デスクトップ共通基盤（900px〜）：画面全体のスクロールを禁止しペイン内スクロールに ===== */
@media (min-width:900px){
  :root{--hd:40px}
  html, body {
    height: 100dvh;
    overflow: hidden;
    padding-bottom: 0;
  }
  .wrap {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
  }
  .nav { display: none; }
  .pconly { display: inline-block; }
  .top h1 { font-size: 13.5px; }
  .top .btn { min-height: 28px; min-width: 28px; padding: 0 12px; font-size: 12.5px; }
  
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 16px;
    padding: 16px 0;
    overflow: hidden;
  }
  .win {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .win .wb {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .win[data-p="graph"] .wb {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .win[data-p="graph"] .board {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .win[data-p="graph"] .tree {
    flex: 1 1 0;
    height: 100%;
  }
  .win[data-p="graph"] .cap,
  .win[data-p="graph"] .legend {
    flex: none;
  }
  .task .row { display: flex; }
  .task .row .btn { width: auto; flex: 1; }
  .cards { grid-template-columns: 1fr; }
}

/* ===== 中規模サイズ（900px〜1279px）：左「あなたの番」、右「図（上）＋作業のようす（下）」の連動構成 ===== */
@media (min-width:900px) and (max-width:1279px){
  .stage {
    grid-template-columns: clamp(320px, 36vw, 420px) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr);
    grid-template-areas: 
      "left graph"
      "left right";
  }
  .win[data-p="left"]  { grid-area: left; }
  .win[data-p="graph"] { grid-area: graph; }
  .win[data-p="right"] { grid-area: right; }
}

/* ===== ワイドサイズ（1280px〜）：左・中央（図）・右の3カラム構成 ===== */
@media (min-width:1280px){
  .stage {
    grid-template-columns: clamp(320px, 24vw, 380px) minmax(0, 1fr) clamp(320px, 25vw, 400px);
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "left graph right";
  }
  .win[data-p="left"]  { grid-area: left; }
  .win[data-p="graph"] { grid-area: graph; }
  .win[data-p="right"] { grid-area: right; }
}

/* =========================================================
   温かみのあるマットオーロラ背景（障子越しの光と、木材の温もり）
   ========================================================= */
(function initAurora() {
  const canvas = document.getElementById('aurora-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const lightPalette = [
    { bg: '#fbf8f2' },
    { color: 'rgba(235, 165, 100, 0.45)', r: 0.55, speedX: 0.0007, speedY: 0.0005, offset: 0 },
    { color: 'rgba(130, 185, 145, 0.40)', r: 0.65, speedX: -0.0005, speedY: 0.0008, offset: 2 },
    { color: 'rgba(245, 210, 140, 0.45)', r: 0.50, speedX: 0.0006, speedY: -0.0006, offset: 4 }
  ];

  const darkPalette = [
    { bg: '#161311' },
    { color: 'rgba(160, 82, 35, 0.35)', r: 0.60, speedX: 0.0006, speedY: 0.0004, offset: 1 },
    { color: 'rgba(42, 92, 62, 0.35)', r: 0.65, speedX: -0.0004, speedY: 0.0007, offset: 3 },
    { color: 'rgba(135, 98, 35, 0.30)', r: 0.55, speedX: 0.0005, speedY: -0.0005, offset: 5 }
  ];

  function isDark() {
    const theme = document.documentElement.dataset.theme;
    if (theme === 'dark') return true;
    if (theme === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  let time = 0;
  function renderAurora() {
    const palette = isDark() ? darkPalette : lightPalette;
    ctx.fillStyle = palette[0].bg;
    ctx.fillRect(0, 0, width, height);

    const maxDim = Math.max(width, height);

    for (let i = 1; i < palette.length; i++) {
      const orb = palette[i];
      const cx = width * 0.5 + Math.cos(time * orb.speedX + orb.offset) * (width * 0.35);
      const cy = height * 0.5 + Math.sin(time * orb.speedY + orb.offset) * (height * 0.35);
      const radius = maxDim * orb.r;

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0, orb.color);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    if (motionOK()) {
      time += 16;
    }
    requestAnimationFrame(renderAurora);
  }
  requestAnimationFrame(renderAurora);
})();

initDlg();rerender();
