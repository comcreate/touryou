name: CI (macOS)

# macOS（arm64）の check と、配布物（Node 同梱の tar.gz・.mcpb）の確かめ。Mac の機械を 1 台だけ待つよう、1 つのジョブで続けて行う。
# macOS の runner は ubuntu の約 10 倍の費用なので、コード・依存・この yml が変わったときだけ動かす
# （docs/release.md の「CI の実行時間と費用」）。release.yml の dist と同じ macos-15。
# 配布物の確かめは PR と手で実行したときだけ（main への push では check だけ）。artifact を上げるのは手で実行したときだけ（1 日）。
# 機械が割り当てられずに落ちたときは、macos-capacity-rerun.yml が 1 回だけ走らせ直す。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-macos.yml"

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (macos-15, node 24)
    runs-on: macos-15
    # macOS arm64 の runner は、割り当てまで長く待つことがある（"capacity constraints"）。待ち時間を含めて 60 分（check と配布物の確かめ）
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check.sh
      # 配布物のビルドは、release.yml の dist と同じ Node（22.20.0）で行う（出すときと同じ作り方で作れることを確かめる）
      - if: github.event_name != 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - if: github.event_name != 'push'
        run: pnpm build
      - name: tar.gz を作る（同梱の Node は、nodejs.org から取得して SHASUMS256.txt と照合する）
        if: github.event_name != 'push'
        run: bash scripts/dist-build.sh "${RUNNER_TEMP}/dist"
      - name: デスクトップアプリの拡張機能（.mcpb）を作り、入口が起動することを確かめる（daemon なしなので invalid_config で終わるのが正しい）
        if: github.event_name != 'push'
        run: |
          d="${RUNNER_TEMP}/mcpb"
          bash scripts/mcpb-build.sh "$d"
          (cd "$d" && shasum -a 256 -c ./*.sha256)
          x="$(mktemp -d)"
          unzip -q "$d"/touryou-mcp-*.mcpb -d "$x"
          out="$(HOME="$(mktemp -d)" node "$x/server/index.mjs" --stdio </dev/null 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q '"event":"mcpbStart"'
          echo "$out" | grep -q 'invalid_config'
      - name: 展開して daemon を起動する（PATH を絞る）
        if: github.event_name != 'push'
        run: bash scripts/dist-smoke.sh "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)"
      - name: 署名と quarantine の状態を記録する（情報のみ）
        if: github.event_name != 'push'
        run: |
          d="$(mktemp -d)"; tar -C "$d" -xzf "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)"
          n="$(ls -d "$d"/touryou-*)/bin/node"
          codesign -dv "$n" 2>&1 | head -8 || true
          xattr -l "$n" || true
          file "$n"
          {
            echo "### macos-15"
            echo "- arch: $(uname -m)"
            echo "- tar.gz: $(du -h "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)" | cut -f1)"
            echo "- 注意: runner 上の展開先には quarantine が付かない。Gatekeeper の影響は、CI では確かめられない（docs/dist-manual-verification.md）"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # 手で実行したときだけ（PR では上げない。artifact の容量の上限〔Artifact storage quota has been hit〕に当たったため。docs/release.md）
        if: github.event_name == 'workflow_dispatch'
        with:
          name: touryou-dist-macos-15
          path: ${{ runner.temp }}/dist/*
          retention-days: 1
