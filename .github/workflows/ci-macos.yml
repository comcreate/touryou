name: CI (macOS)

# macOS（arm64）の check。macOS の runner は ubuntu の約 10 倍の費用なので、コード・依存・この yml が変わったときだけ動かす
# （docs/release.md の「CI の実行時間と費用」）。release.yml の dist と同じ macos-15。
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig*.json"
      - ".github/workflows/ci-macos.yml"

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (macos-15, node 24)
    runs-on: macos-15
    # macOS arm64 の runner は、割り当てまで長く待つことがある（"capacity constraints"）。待ち時間を含めて 45 分
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check.sh
