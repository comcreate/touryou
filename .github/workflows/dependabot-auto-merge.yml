name: Dependabot auto-merge

# Dependabot の github-actions の PR（patch・minor）に auto-merge を付ける。マージは GitHub が、ruleset の必須の check
# （check (ubuntu-latest, node 22)・(node 24)）が通ってから行う。メジャーの上げ・.github/workflows/ の外を変える PR には付けない（人がレビューする）。
# 基は GitHub の公式の文書「Automating Dependabot with GitHub Actions」の「Enabling automerge on a pull request」。
# pull_request_target は使わない（PR のコードを、書き込みの権限で扱わないため）。checkout もしない（PR のコードを動かさない）。
# docs/release.md の「Dependabot の actions の更新と自動マージ」。
on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'comcreate/touryou'
    steps:
      - name: Dependabot の PR の中身を見る
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: 変わったファイルが .github/workflows/ の中だけかを見る
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          outside="$(printf '%s\n' "${files}" | grep -v '^\.github/workflows/[^/]*\.ya\?ml$' | grep -v '^$' || true)"
          if [ -z "${files}" ] || [ -n "${outside}" ]; then
            echo "only_workflows=false" >> "$GITHUB_OUTPUT"
            echo ".github/workflows/ の外のファイルがあるので、自動でマージしません" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "only_workflows=true" >> "$GITHUB_OUTPUT"
          fi
      - name: auto-merge を付ける（github_actions の patch・minor で、.github/workflows/ の中だけ）
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.files.outputs.only_workflows == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
      - name: 対象でなければ auto-merge を外す（push し直しで対象から外れたとき。付いていなければ何もしない）
        if: >-
          !(steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.files.outputs.only_workflows == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          echo "自動マージの対象ではありません（メジャーの上げ・github_actions でない・.github/workflows/ の外を変える）。人がレビューします" >> "$GITHUB_STEP_SUMMARY"
