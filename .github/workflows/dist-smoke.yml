name: Dist smoke (experiment)

# 実験: Node 同梱の配布物（tar.gz）を macOS の runner で作り、展開して daemon を起動できるかを確かめる。
# リリース・タグ・asset の公開はしない。PR では、ビルド・検査・smoke だけで、artifact は上げない（Actions の artifact の容量を使わないため）。
# 手で実行（workflow_dispatch）したときだけ、成果物を artifact（1 日）に置く。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/dist-smoke.yml"
      - "scripts/dist-build.sh"
      - "scripts/mcpb-build.sh"
      - "packages/mcp/mcpb/**"
      - "packages/mcp/src/mcpb-entry.ts"
      - "scripts/dist-smoke.sh"
      - "scripts/dist-smoke-hook.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"

permissions:
  contents: read

concurrency:
  group: dist-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS arm64 の runner の割り当ての待ちを含めて 60 分
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # arm64 のみ（x64〔Intel〕は対象外。docs/release.md の「対象の OS・CPU」）
        os: [macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0 # ビルド（pnpm）用。同梱する Node は、dist-build.sh が公式の配布物を取得して使う
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: tar.gz を作る（同梱の Node は、nodejs.org から取得して SHASUMS256.txt と照合する）
        run: bash scripts/dist-build.sh "${RUNNER_TEMP}/dist"
      - name: デスクトップアプリの拡張機能（.mcpb）を作り、入口が起動することを確かめる（daemon なしなので invalid_config で終わるのが正しい）
        run: |
          d="${RUNNER_TEMP}/mcpb"
          bash scripts/mcpb-build.sh "$d"
          (cd "$d" && shasum -a 256 -c ./*.sha256)
          x="$(mktemp -d)"
          unzip -q "$d"/touryou-mcp-*.mcpb -d "$x"
          out="$(HOME="$(mktemp -d)" node "$x/server/index.mjs" --stdio </dev/null 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q '"event":"mcpbStart"'
          echo "$out" | grep -q 'invalid_config'
      - name: 展開して daemon を起動する（PATH を絞る）
        run: bash scripts/dist-smoke.sh "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)"
      - name: 署名と quarantine の状態を記録する（情報のみ）
        run: |
          d="$(mktemp -d)"; tar -C "$d" -xzf "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)"
          n="$(ls -d "$d"/touryou-*)/bin/node"
          codesign -dv "$n" 2>&1 | head -8 || true
          xattr -l "$n" || true
          file "$n"
          {
            echo "### ${{ matrix.os }}"
            echo "- arch: $(uname -m)"
            echo "- tar.gz: $(du -h "$(ls "${RUNNER_TEMP}"/dist/touryou-*.tar.gz)" | cut -f1)"
            echo "- 注意: runner 上の展開先には quarantine が付かない。Gatekeeper の影響は、CI では確かめられない（docs/dist-manual-verification.md）"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # 手で実行したときだけ（PR では上げない。artifact の容量の上限〔Artifact storage quota has been hit〕に当たったため。docs/release.md）
        if: github.event_name == 'workflow_dispatch'
        with:
          name: touryou-dist-${{ matrix.os }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 1
