<title>状態画面 第 4 弾 案 1</title>
<!--
  第 4 弾 案 1「第 2 弾の矢印＋目盛りのバー」：第 3 弾の案 2（出入口の点）を土台に、線の出る場所を「親ごとの細長い縦のバー」に変えた図。
  図：親の右に細いバーが 1 本。線 1 本ごとに別の点がバーの上に一定の間隔（18px）で並ぶ。ノードの高さには関係しない。点の順は子の上下の順なので、線は交わらない。
  この案の矢印：第 2 弾の案 2（金の糸）と同じ。金の破線（7 4）が流れる、色は新しさ（濃い→薄い）、塗りの三角の矢じり、S 字の曲線、バーは目盛り付き。
  この案の札（種類と経過時間：「判断を求める 3 分前」など）：線の始まりの直線の上に、枠なしの文字で置く。線の始まりは同じ長さの直線なので、隣の札と重ならない。
  図の操作（全案で同じ）：ドラッグで動かす、ホイール・ピンチ・ボタンで拡大縮小、全体を表示（フィット）、キーボード（矢印・＋・−・0）。
  配置・ヘッダー・スマホ：第 3 弾の決まりを引き継ぐ（1280px 以上は左・中央の図・右の詳細、900〜1279px は 2 列まで、ヘッダー PC 52px・スマホ 48px）。
  値はすべて作り物。外の通信・CDN・外部フォントは使わない。文字は textContent、SVG は部品の関数だけで作る。innerHTML・style 属性は使わない。
-->

/* ===== 案ごとの見た目（案 1：第 2 弾の矢印＋目盛りのバー）===== */
:root{--k-ask:var(--wire);--k-prog:var(--wire);--k-fail:var(--wire);--k-req:var(--wire);--k-done:var(--wire-over)}
.ln{stroke-width:1.4;stroke-dasharray:7 4}
.ln.a1{stroke-width:1.9}.ln.a2{--c:var(--wire2);opacity:.85}.ln.a3{--c:var(--wire3);opacity:.7}.ln.a4{--c:var(--wire4);opacity:.55}

<script>
"use strict";

function layout(o){
  const kids=id=>N.filter(x=>x.p===id),pos={};let leaf=0,maxD=0;
  (function place(id,d){maxD=Math.max(maxD,d);const ks=kids(id);
    if(!ks.length){pos[id]={d,cy:o.pad+o.row/2+leaf*o.row};leaf++;return}
    ks.forEach(k=>place(k.id,d+1));const ys=ks.map(k=>pos[k.id].cy);pos[id]={d,cy:(Math.min(...ys)+Math.max(...ys))/2}})("n-root",0);
  return{kids,pos,X:id=>o.pad+pos[id].d*o.col,W:o.pad*2+maxD*o.col+o.bw,H:o.pad*2+leaf*o.row}}

  bd.append(ul)}
function viewDetail(bd){
  const n=NB[S.sel],head=el("div","row");head.append(chip(n),el("b","",P(n.sh)));
  bd.append(head,el("p","lead",P(n.t)),spark(n.id));
  if(ns(n)==="run"&&n.pct!=null)bd.append(progBar(n));
  bd.append(el("p","lead",T("histLead")));
  const ul=el("ul","hist");
  msgsOf(n.id).forEach(x=>{const o=NB[x.f===n.id?x.to:x.f],li=el("li",x.h&&!S.ans[x.f]?"h":"");
    li.append(el("span","ar",x.d==="up"?"↑":"↓"),el("span","",(x.d==="up"?"← ":"→ ")+P(o.sh)+"　"+T(x.k)+"　"+agoT(x.m)+"　"+T(x.st)));ul.append(li)});
  bd.append(ul);if(ns(n)==="stall"&&n.cli)bd.append(cmdBox(n))}
function render(){
  const stage=$("stage"),top=$("top"),tabs=$("tabs"),slot=$("lostslot");stage.replaceChildren();top.replaceChildren();tabs.replaceChildren();slot.replaceChildren();
  const rest=restTodo(),cnt={turn:0,go:0,over:0};N.forEach(n=>{cnt[tier(n)]++});
  top.append(el("h1","",T("title")),connPill(),themeBtn(),setBtn());
  if(!S.conn)slot.append(lostBar(false));
  [["turn",T("bandT"),String(rest.length),b=>viewTurn(b,rest,cnt)],["graph",T("graph"),"",viewGraph],["work",T("tasks"),String(N.length),viewWork],
   ["inbox",T("inbox"),T("unres",{n:rest.length}),viewInbox],["detail",T("open"),P(NB[S.sel].sh),viewDetail]].forEach(([k,t,meta,fn])=>{
    const w=el("section","win"+(k===S.tab?" on":""));w.dataset.p=k;w.setAttribute("aria-label",t);
    const hd=el("header","wh");hd.append(el("h2","",t),el("span","wm",meta));
    const bd=el("div","wb");fn(bd);w.append(hd,bd);stage.append(w)});
  tabs.setAttribute("aria-label",T("tabsAria"));
  TABS.forEach(([k,lb,ic])=>{const b=el("button","tab");b.setAttribute("role","tab");b.setAttribute("aria-selected",S.tab===k?"true":"false");b.dataset.fk="tab-"+k;
    b.append(el("span","ic",ic),el("span","",T(lb)));
    if((k==="turn"||k==="inbox")&&rest.length)b.append(el("span","bdg",String(rest.length)));
    b.addEventListener("click",()=>goTab(k));tabs.append(b)});
  if(S.focusId){const id=S.focusId;S.focusId=null;const c=$("card-"+id);
    if(c){c.scrollIntoView({behavior:motionOK()?"smooth":"auto",block:"center"});c.focus({preventScroll:true});c.classList.add("flash")}}
}
initDlg();rerender();
</script>
