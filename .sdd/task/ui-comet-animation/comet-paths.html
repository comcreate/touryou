<!doctype html><meta charset="utf-8"><title>彗星の確認（線にかけるグラデーション）</title>
<style>
:root{--ai:#8fb0ea;--bg:#16181d}
body{background:var(--bg);color:#ccd;font:14px sans-serif;margin:24px}
p{margin:8px 0 4px}
.box{width:520px;height:150px;margin:0 0 12px;border:1px solid #333}
path{fill:none}
.base{stroke:var(--ai);stroke-width:2.5;stroke-dasharray:6 8;opacity:.8}
.comet{stroke:var(--ai);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--ai))}
.sweep{animation:sweep 1.8s linear infinite}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(660px)}}
@media (prefers-reduced-motion: reduce){.sweep{animation:none}.comet{display:none}}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity=".8"/><stop offset=".95" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient></defs></svg>
<p>① 水平の直線（今の図）</p>
<div class="box"><svg width="520" height="150" viewBox="0 0 520 150">
<defs><mask id="m0" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="150"><rect class="sweep" x="-140" y="0" width="140" height="150" fill="url(#g)"/></mask></defs>
<path class="base" d="M 20 75 L 500 75"/>
<path class="comet" d="M 20 75 L 500 75" mask="url(#m0)"/></svg></div>
<p>② 直角の折れ線（縦の区間あり）</p>
<div class="box"><svg width="520" height="150" viewBox="0 0 520 150">
<defs><mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="150"><rect class="sweep" x="-140" y="0" width="140" height="150" fill="url(#g)"/></mask></defs>
<path class="base" d="M 20 30 L 260 30 L 260 120 L 500 120"/>
<path class="comet" d="M 20 30 L 260 30 L 260 120 L 500 120" mask="url(#m1)"/></svg></div>
<p>③ 斜めの折れ線</p>
<div class="box"><svg width="520" height="150" viewBox="0 0 520 150">
<defs><mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="150"><rect class="sweep" x="-140" y="0" width="140" height="150" fill="url(#g)"/></mask></defs>
<path class="base" d="M 20 120 L 200 30 L 340 120 L 500 40"/>
<path class="comet" d="M 20 120 L 200 30 L 340 120 L 500 40" mask="url(#m2)"/></svg></div>
<p>④ 曲線</p>
<div class="box"><svg width="520" height="150" viewBox="0 0 520 150">
<defs><mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="150"><rect class="sweep" x="-140" y="0" width="140" height="150" fill="url(#g)"/></mask></defs>
<path class="base" d="M 20 75 C 150 0, 300 150, 500 75"/>
<path class="comet" d="M 20 75 C 150 0, 300 150, 500 75" mask="url(#m3)"/></svg></div>
<p>⑤ 短い線</p>
<div class="box"><svg width="520" height="150" viewBox="0 0 520 150">
<defs><mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="150"><rect class="sweep" x="-140" y="0" width="140" height="150" fill="url(#g)"/></mask></defs>
<path class="base" d="M 20 75 L 120 75"/>
<path class="comet" d="M 20 75 L 120 75" mask="url(#m4)"/></svg></div>
