<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>状態画面の見本</title>
<!--
  Issue #89 の画面の見本（作り直し 2）。値はすべて作り物。外のファイル・CDN は使わない。

  関係図について：
  - 本番は Rete.js で描く（描画のプラグインを使わず自前で描く R0。research.md 6.1・6.5）。
  - この見本には Rete.js を入れていない。R0 の自前の描き手が出す形を、SVG と CSS で示している。
    箱の並び（木の形。根が左、子は右。親の右の幹から枝分かれ）・上りと下りを別のつながりにすること・拡大と移動のボタンは、
    area のプラグインの操作（translate・zoom）を見た目で示したもの。

  安全の決まり（本番に合わせたところ）：
  - 文字は textContent、要素は createElement と、SVG は svgEl の 1 か所の createElementNS だけで作る。
  - innerHTML・eval・style 属性の文字列は使わない。SVG の属性は数と、数で組んだ d とクラスだけ。
  本番から外しているところ：
  - CSS をこの <style> にまとめて書いている（本番は /ui/app.css。CSP の style-src 'self'）。
  - 動く点に el.style.offsetPath を使う（D8 は未決定。本番で使うなら svgEl と同じく 1 か所に閉じる）。
  - 写すボタンの navigator.clipboard（本番は走査の SAFE に clipboard・writeText を足す。6.3）。

  見た目の考え：棟梁の現場の図面。明るい側は木の色の紙に墨、暗い側は夜の墨に灯り。
  藍＝上り（子 → 親）、紫＝下り（親 → 子）、柿＝人が動くこと。目立たせるのは関係図の 1 か所だけ。
-->
<style>
:root{
  --paper:#f3efe6;--sheet:#fbf9f4;--ink:#22201c;--ink-2:#5b5650;--rule:#d8d0c0;--grid:#e7e0d1;
  --ai:#2a4f8f;--ai-soft:#dfe7f4;--murasaki:#7b3f8c;--murasaki-soft:#efe2f2;
  --kaki:#c95a00;--kaki-soft:#fbe6d2;--matsu:#2f6b45;--matsu-soft:#dcebdf;--shu:#a3261c;--shu-soft:#f7dfdb;
  --on-strong:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181c;--sheet:#1e2126;--ink:#ebe6dc;--ink-2:#a39d93;--rule:#363a42;--grid:#23262c;
  --ai:#86a8e8;--ai-soft:#1e2a40;--murasaki:#cf9ade;--murasaki-soft:#2e2134;
  --kaki:#ff9a3c;--kaki-soft:#3b2614;--matsu:#7fc495;--matsu-soft:#18301f;--shu:#ff8c80;--shu-soft:#3d1b18;
  --on-strong:#16181c;
}}
:root[data-theme="dark"]{
  --paper:#16181c;--sheet:#1e2126;--ink:#ebe6dc;--ink-2:#a39d93;--rule:#363a42;--grid:#23262c;
  --ai:#86a8e8;--ai-soft:#1e2a40;--murasaki:#cf9ade;--murasaki-soft:#2e2134;
  --kaki:#ff9a3c;--kaki-soft:#3b2614;--matsu:#7fc495;--matsu-soft:#18301f;--shu:#ff8c80;--shu-soft:#3d1b18;
  --on-strong:#16181c;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-feature-settings:"palt";transition:background .4s,color .4s}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 48px}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* 上の 1 行 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
.conn{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--matsu);animation:breathe 2.4s ease-in-out infinite}
.top .tools{margin-left:auto;display:flex;gap:6px}

button{font:inherit;font-size:14px;line-height:1.4;padding:6px 14px;border-radius:999px;border:1px solid var(--rule);
  background:var(--sheet);color:var(--ink);cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
button:hover{border-color:var(--ink-2)}
button:active{transform:scale(.95)}
button.go{background:var(--kaki);border-color:var(--kaki);color:var(--on-strong);font-weight:700}
button.quiet{background:transparent}
button.sm{font-size:12px;padding:2px 10px}
button.done{background:var(--matsu);border-color:var(--matsu);color:var(--on-strong)}

/* いまあなたがすること */
.now{margin:24px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:end}
.now .count{grid-row:span 2;font-size:64px;line-height:1;font-weight:800;color:var(--kaki);min-width:1.2ch;text-align:center}
.now .count.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
.now h2{margin:0;font-size:22px}
.now p{margin:0;color:var(--ink-2);font-size:14px}
.todo{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.task{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--kaki);border-radius:4px 12px 12px 4px;
  padding:12px 16px;display:grid;gap:6px;transition:opacity .4s,transform .4s,max-height .5s,padding .5s,margin .5s}
.task.leave{opacity:0;transform:translateX(24px)}
.task .who{font-size:13px;color:var(--ink-2)}
.task .who b{color:var(--ink);font-weight:700}
.task .ask{font-size:16px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:6px 10px}
code{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:13.5px;word-break:break-all}
.empty{padding:16px;border:1px dashed var(--rule);border-radius:12px;color:var(--ink-2);background:var(--sheet)}

/* 関係図 */
.sec{margin-top:36px}
.sec>h2{font-size:18px;margin:0 0 4px}
.sec>p.lead{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.board{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;overflow-x:auto;overflow-y:hidden}
.board svg{display:block;width:100%;min-width:760px;height:auto;touch-action:none}
.legend{position:sticky;left:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:22px;height:0;border-top:3px solid currentColor;vertical-align:middle;margin-right:6px}
.legend .u{color:var(--ai)}.legend .d{color:var(--murasaki)}.legend .h{color:var(--kaki)}
.legend .p{color:var(--ink-2)}
.zoom{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.zoom button{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;background:var(--sheet)}
.zoom button.fit{width:auto;padding:0 12px;border-radius:999px;font-size:13px}

.gridline{stroke:var(--grid);stroke-width:1}
.kin{fill:none;stroke:var(--ink-2);stroke-width:2;opacity:.45}
.tip{stroke:none;opacity:0;animation:fadein .4s ease-out forwards;animation-delay:1s}.tip.up{fill:var(--ai)}.tip.down{fill:var(--murasaki)}.tip.human{fill:var(--kaki)}
.dim{opacity:.1!important}
.shape{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin:0 0 4px}
.judge{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.ctl{display:grid;gap:4px;margin-bottom:4px}
.shape{flex-wrap:wrap}
.mlabel .when{opacity:0;transition:opacity .2s}
.mlabel.keep .when,.mlabel.lit .when{opacity:1}
.tlist{display:grid;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow-x:auto}
.trow{display:grid;grid-template-columns:minmax(220px,1.6fr) 130px 1fr 1fr;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--rule);font-size:13.5px;min-width:640px}
.trow.thead{border-top:0;font-size:12.5px;color:var(--ink-2);font-weight:700}
.trow.need{background:var(--kaki-soft)}
.tname{display:flex;align-items:center;gap:6px}
.tname[data-depth="1"]{padding-left:18px}.tname[data-depth="2"]{padding-left:36px}.tname[data-depth="3"]{padding-left:54px}
.tname button{white-space:nowrap}
.lvl{color:var(--ink-2)}
.msgcell{font-weight:700}.msgcell.u{color:var(--ai)}.msgcell.d{color:var(--murasaki)}.msgcell.h{color:var(--kaki)}.msgcell.none{color:var(--ink-2);font-weight:400}
[hidden]{display:none!important}
.trunk{fill:none;stroke:var(--ink-2);stroke-width:4;stroke-linecap:round;opacity:.55}
.twig{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:2 5;opacity:.6}
.fold .box{fill:var(--paper);stroke:var(--rule);stroke-dasharray:4 4;stroke-width:1.5}
.fold{cursor:pointer}.fold .ttl{font-size:13px;font-weight:700;fill:var(--ink)}.fold .sub{font-size:11.5px;fill:var(--ink-2)}
.wire.f1.flow{animation-duration:.9s}.wire.f2.flow{animation-duration:2.2s}.wire.f3.flow{animation-duration:4.5s;opacity:.6}
.wire.f0.flow{animation:none;opacity:.45}
.pip.f1{animation-duration:1.6s}.pip.f2{animation-duration:3.2s}.pip.f3{animation-duration:6s;opacity:.6}
.pip.wait{offset-distance:100%;animation:waitpulse 1.2s ease-in-out infinite}
.wire.stall{stroke:var(--ink-2)!important;opacity:.55}.wire.stall.flow{animation:none;stroke-dasharray:3 6}
.tip.stall{fill:var(--ink-2)}
.wire.still{stroke-width:1.5!important;opacity:.5}.wire.still.flow{animation:none;stroke-dasharray:none}
.wire.fail{stroke:var(--shu)!important}.wire.fail.flow{animation:none;stroke-dasharray:none}.tip.fail{fill:var(--shu)}
.mark{font-size:12px;font-weight:800}.markbg{fill:var(--sheet);stroke-width:1.5}
.markbg.stall{stroke:var(--ink-2)}.mark.stall{fill:var(--ink-2)}
.markbg.still{stroke:var(--ink-2)}.mark.still{fill:var(--ink-2);font-size:10px}
.markbg.fail{stroke:var(--shu);animation:failflash 1.2s ease-out 1 both;animation-delay:1s}.mark.fail{fill:var(--shu)}
.mlabel.stall,.mlabel.still{fill:var(--ink-2)}.mlabel.fail{fill:var(--shu)}
.node.s-stall rect.box{animation:slowblink 2.8s ease-in-out infinite}
.node.s-done rect.box,.node.s-stopped rect.box{fill:var(--paper)}
.states{display:grid;gap:4px;padding:8px 14px 12px;font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--rule)}
.srow{display:grid;grid-template-columns:34px 9em 1fr;gap:8px;align-items:center}
.srow b{color:var(--ink)}
.sw{height:0;border-top:3px dashed var(--ai)}
.s-human .sw{border-top-color:var(--kaki);border-top-width:4px}
.s-stall .sw{border-top:3px dotted var(--ink-2)}
.s-still .sw{border-top:1.5px solid var(--ink-2)}
.s-fail .sw{border-top:3px solid var(--shu)}
.s-flow .sw{animation:legendflow 1s linear infinite;border-image:repeating-linear-gradient(90deg,var(--ai) 0 6px,transparent 6px 12px) 3}
@keyframes waitpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 var(--kaki-soft)}50%{transform:scale(1.5);box-shadow:0 0 0 6px var(--kaki-soft)}}
@keyframes slowblink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes failflash{0%{stroke-width:1.5}30%{stroke-width:7}100%{stroke-width:1.5}}
@keyframes legendflow{to{border-image-source:repeating-linear-gradient(90deg,var(--ai) 0 6px,transparent 6px 12px)}}
@media (max-width:640px){.srow{grid-template-columns:34px 1fr}.srow span:last-child{grid-column:2}}
.piplayer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

.wire{fill:none;stroke-linecap:round}
.wire.base{stroke-width:2.5;opacity:.35;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}
.wire.flow{stroke-width:2.5;stroke-dasharray:6 12;animation:flow 1.6s linear infinite;opacity:0;animation-delay:1.2s}
.wire.flow.on{opacity:1;transition:opacity .4s}
.up{stroke:var(--ai)}.down{stroke:var(--murasaki)}
.human{stroke:var(--kaki)!important}
.wire.base.human{stroke-width:4;opacity:.5}
.wire.flow.human{stroke-width:4;stroke-dasharray:10 8;animation-duration:.7s}
.wire.dim{opacity:.08!important}
.wire.hot{stroke-width:4}
.mlabel{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round;font-size:12px;opacity:0;animation:fadein .5s ease-out forwards}
.mlabel .k{font-weight:700}
.mlabel.u{fill:var(--ai)}.mlabel.d{fill:var(--murasaki)}.mlabel.h{fill:var(--kaki)}
.mlabel.dim{opacity:.15!important}
.pip{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;
  offset-rotate:0deg;animation:travel 2.6s cubic-bezier(.45,0,.55,1) infinite}
.pip.u{background:var(--ai)}.pip.d{background:var(--murasaki)}.pip.h{background:var(--kaki);width:13px;height:13px;animation-duration:1.4s;box-shadow:0 0 0 4px var(--kaki-soft)}

.node{cursor:pointer;transition:transform .25s}
.node rect.box{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5;transition:stroke .2s}
.node:hover rect.box,.node:focus-visible rect.box,.node.hot rect.box{stroke:var(--ink)}
.node:hover,.node.hot{transform:translateY(-3px)}
.node.need rect.box{stroke:var(--kaki);stroke-width:2.5}
.node .halo{fill:none;stroke:var(--kaki);stroke-width:2;opacity:0}
.node.need .halo{animation:halo 1.8s ease-out infinite}
.node .ttl{font-size:13.5px;font-weight:700;fill:var(--ink)}
.node .sub{font-size:11.5px;fill:var(--ink-2)}
.node .badge{fill:var(--kaki)}
.node .badge-t{font-size:12px;font-weight:800;fill:var(--on-strong)}
.node .st{font-size:11.5px;font-weight:700}
.st-run{fill:var(--matsu)}.st-wait{fill:var(--kaki)}.st-done{fill:var(--ink-2)}.st-stall{fill:var(--shu)}
.port{stroke:var(--sheet);stroke-width:2}
.port.u{fill:var(--ai)}.port.d{fill:var(--murasaki)}.port.k{fill:var(--ink-2)}

/* 作業ごとのようす */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;
  scroll-margin-top:16px;transition:box-shadow .3s,border-color .3s}
.card.flash{animation:flash 1.6s ease-out}
.card.need{border-color:var(--kaki)}
.card h3{margin:0;font-size:15.5px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;line-height:1.8}
.chip.run{background:var(--matsu-soft);color:var(--matsu)}
.chip.wait{background:var(--kaki-soft);color:var(--kaki)}
.chip.done{background:var(--grid);color:var(--ink-2)}
.chip.stall{background:var(--shu-soft);color:var(--shu)}
.chip.run::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:breathe 1.6s infinite}
.spark{display:block;width:100%;height:34px}
.spark .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.3,1.2) both}
.spark .bar.u{fill:var(--ai)}.spark .bar.d{fill:var(--murasaki)}.spark .bar.h{fill:var(--kaki)}
.spark .axis{stroke:var(--rule)}
.flowlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.flowlist li{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:start}
.flowlist .ar{font-weight:800;text-align:center}
.flowlist .ar.u{color:var(--ai)}.flowlist .ar.d{color:var(--murasaki)}.flowlist .ar.h{color:var(--kaki)}
.flowlist .t{color:var(--ink-2);font-size:12px;white-space:nowrap}
details>summary{cursor:pointer;font-size:13px;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid currentColor;transition:transform .2s;transform-origin:3px 5px}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>:not(summary){animation:open .3s ease-out both}
.folded{border-top:1px dashed var(--rule);padding-top:6px}

/* 管理（取り消せない操作） */
.admin{margin-top:40px;border:2px solid var(--shu);border-radius:14px;padding:4px 16px;background:var(--sheet)}
.admin>summary{font-size:16px;font-weight:700;color:var(--shu);padding:10px 0}
.admin .warn{margin:0 0 12px;font-size:14px;color:var(--shu);background:var(--shu-soft);border-radius:8px;padding:8px 12px}
.admin .op{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--rule)}
.admin .op p{margin:0;font-size:13px;color:var(--ink-2)}
button.danger{border-color:var(--shu);color:var(--shu);background:transparent}
button.danger::before{content:"⚠ "}
footer{margin-top:32px;font-size:12px;color:var(--ink-2)}

/* 動き */
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bump{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes fadein{to{opacity:1}}
@keyframes travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes halo{0%{opacity:.9;stroke-width:2}100%{opacity:0;stroke-width:14}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--kaki)}30%{box-shadow:0 0 0 6px var(--kaki-soft)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes open{from{opacity:0;transform:translateY(-4px)}}

.still *,.still *::before{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
.still .pip{display:none}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  .pip{display:none}
}
@media (max-width:640px){
  .now .count{font-size:48px}
  .now h2{font-size:19px}
  .top .tools{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
// ---- 作り物の値（表示モデルの形。research.md 1.3・D3） ----
const NOW = Date.parse("2026-11-17T10:00:00Z");
const min = (m) => new Date(NOW - m * 60000).toISOString();
const VIEW = {
  connection: { ok: true, text: "つながっています" },
  nodes: [
    { id: "n-root", role: "統合", parentId: null, state: "run", title: "見本の店の注文画面を作り直し、支払いの流れを分かりやすくする", lastActivityAt: min(1), needsHuman: 0 },
    { id: "n-a1", role: "作業", parentId: "n-root", state: "wait", title: "支払い方法の選び方の画面を作る。カードと振り込みの二つを並べ、違いを短く書く", lastActivityAt: min(3), needsHuman: 1 },
    { id: "n-b2", role: "統合", parentId: "n-root", state: "run", title: "注文の確認のメールの文を見直し、送る時刻をそろえる", lastActivityAt: min(6), needsHuman: 0 },
    { id: "n-b3", role: "作業", parentId: "n-b2", state: "stall", title: "メールの文の雛形を三つ作り、試験の宛先で送って確かめる", lastActivityAt: min(42), needsHuman: 1, cli: true },
    { id: "n-c4", role: "作業", parentId: "n-root", state: "done", title: "注文の一覧の並び順を、新しい順にする", lastActivityAt: min(55), needsHuman: 0 },
    { id: "n-h10", role: "作業", parentId: "n-b2", state: "run", title: "送ったメールの控えを残す場所を決める（起こしたばかり）", lastActivityAt: min(0.5), needsHuman: 0 }
  ],
  // dir: up（子 → 親）・down（親 → 子）。human：人の操作が要る
  messages: [

function visibleKids(nodes, id) {
  const all = nodes.filter(n => n.parentId === id);
  if (all.length <= MAXKIDS) return { show: all, folded: [], more: [] };
  const live = all.filter(n => n.state !== "done" && n.state !== "stopped");
  const folded = all.filter(n => n.state === "done" || n.state === "stopped");
  const room = MAXKIDS - 1;

function layout(nodes) {            // research.md 6.1 の layoutOf の形（純粋な計算）
  const pos = {}, groups = {}; let leaf = 0, maxDepth = 0;

    if (!ids.length && !vk.folded.length) { pos[id] = { cy: 30 + LEAF / 2 + leaf++ * LEAF, d }; return; }
    ids.forEach(k => place(k, d + 1));
    if (vk.folded.length || vk.more.length) { pos["fold-" + id] = { cy: 30 + LEAF / 2 + leaf++ * LEAF, d: d + 1, fold: true }; }
    const ys = [...ids.map(k => pos[k].cy), ...(pos["fold-" + id] ? [pos["fold-" + id].cy] : [])];
    pos[id] = { cy: (Math.min(...ys) + Math.max(...ys)) / 2, d };
  })("n-root", 0);
  for (const id in pos) { const p = pos[id]; p.x = 40 + p.d * COL; p.y = p.cy - BH / 2; }

function laneState(child, m) {
  if (child.state === "stall") return "stall";

function drawFold(gr, p) {

  gEl.append(svgEl("text", { class: "sub", x: p.x + 16, y: p.cy + 16 }, gr.more.length ? "ほかに " + gr.more.length + "（一覧で見る）" : "一覧で見る"));
  gEl.append(svgEl("title", {}, gr.folded.map(n => n.title).join("／")));

function goCard(id) {
  const c = document.getElementById("card-" + id); if (!c) return;
  c.scrollIntoView({ behavior: document.documentElement.classList.contains("still") || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
}
function drawNode(n, p) {
  const id = n.id;
  const node = svgEl("g", { class: "node s-" + n.state + (n.needsHuman ? " need" : ""), tabindex: 0, role: "button", "aria-label": n.title + "。" + STATE[n.state][0] });
  node.append(svgEl("rect", { class: "halo", x: p.x, y: p.y, width: BW, height: BH, rx: 12 }));
  node.append(svgEl("rect", { class: "box", x: p.x, y: p.y, width: BW, height: BH, rx: 12 }));
  node.append(svgEl("text", { class: "ttl", x: p.x + 12, y: p.y + 24 }, short(n.title, 12)));
  node.append(svgEl("text", { class: "sub", x: p.x + 12, y: p.y + 44 }, n.role + "　" + ago(n.lastActivityAt)));
  node.append(svgEl("text", { class: "st st-" + n.state, x: p.x + 12, y: p.y + 66 }, STATE[n.state][0]));
  if (n.needsHuman) {
    node.append(svgEl("circle", { class: "badge", cx: p.x + BW - 4, cy: p.y + 4, r: 12 }));
    node.append(svgEl("text", { class: "badge-t", x: p.x + BW - 4, y: p.y + 8.5, "text-anchor": "middle" }, n.needsHuman));
  }
  node.append(svgEl("title", {}, n.title));
  const hot = (on) => {
    node.classList.toggle("hot", on);
    for (const w of drawn) { const mine = w.ids.includes(id); for (const e of w.parts) { e.classList.toggle("dim", on && !mine); e.classList.toggle("lit", on && mine); } }
  };
  node.addEventListener("pointerenter", () => hot(true)); node.addEventListener("pointerleave", () => hot(false));
  node.addEventListener("focus", () => hot(true)); node.addEventListener("blur", () => hot(false));
  node.addEventListener("click", () => goCard(id));
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goCard(id); } });
  world.append(node);
}
function drawList(nodes, msgs) {      // 一覧：木の字下げ＋最後の上り・下り
  listView.replaceChildren();
  const head = el("div", "trow thead");
  head.append(el("span", "", "作業"), el("span", "", "状態"), el("span", "", "← 最後の上り（子 → 親）"), el("span", "", "→ 最後の下り（親 → 子）"));
  listView.append(head);
  (function row(n, d) {
    const r = el("div", "trow" + (n.needsHuman ? " need" : ""));
    const t = el("span", "tname"); t.dataset.depth = String(d);
    t.append(el("span", "lvl", d ? "└" : ""), el("b", "", short(n.title, 28)));
    const go = el("button", "sm quiet", "詳しく"); go.addEventListener("click", () => goCard(n.id)); t.append(go);
    const cell = (m, dir) => { const c = el("span", "msgcell " + (m ? (m.human ? "h" : dir) : "none")); c.textContent = m ? (dir === "u" ? "← " : "→ ") + m.kind + "　" + ago(m.at) : (n.parentId ? "まだない" : "（いちばん上）"); return c; };
    r.append(t, el("span", "chip " + STATE[n.state][1], STATE[n.state][0]), cell(n.parentId && latestOf(msgs, n.id, n.parentId), "u"), cell(n.parentId && latestOf(msgs, n.parentId, n.id), "d"));
    listView.append(r);
    nodes.filter(k => k.parentId === n.id).forEach(k => row(k, d + 1));

}
// 拡大・移動（Rete の area の zoom・translate を見た目で示す）
let vb = { x: 0, y: 0, w: 10, h: 10 };
function applyVB() {
  svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
  const s = svg.clientWidth / vb.w;
  pipLayer.style.transform = "scale(" + s + ") translate(" + (-vb.x) + "px," + (-vb.y) + "px)";
}
const zoomBy = (f) => { const cxv = vb.x + vb.w / 2, cyv = vb.y + vb.h / 2; vb.w = Math.max(W / 4, Math.min(W, vb.w / f)); vb.h = vb.w * H / W; vb.x = Math.max(0, Math.min(W - vb.w, cxv - vb.w / 2)); vb.y = Math.max(0, Math.min(H - vb.h, cyv - vb.h / 2)); applyVB(); };
const zoom = el("div", "zoom");
const zi = el("button", "", "＋"), zo = el("button", "", "−"), zf = el("button", "fit", "全体を見る");
zi.setAttribute("aria-label", "拡大する"); zo.setAttribute("aria-label", "縮める");
zi.addEventListener("click", () => zoomBy(1.4)); zo.addEventListener("click", () => zoomBy(1 / 1.4));
zf.addEventListener("click", () => { vb = { x: 0, y: 0, w: W, h: H }; applyVB(); });
zoom.append(zi, zo, zf); board.append(zoom);
let drag = null;
svg.addEventListener("pointerdown", (e) => { if (e.target.closest(".node,.fold")) return; drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", (e) => { if (!drag) return; const s = vb.w / svg.clientWidth; vb.x = Math.max(0, Math.min(W - vb.w, drag.vx - (e.clientX - drag.x) * s)); vb.y = Math.max(0, Math.min(H - vb.h, drag.vy - (e.clientY - drag.y) * s)); applyVB(); });
svg.addEventListener("pointerup", () => { drag = null; });
new ResizeObserver(applyVB).observe(svg);
// 凡例：向きと、状態の見え方
const legend = el("div", "legend");
legend.append(el("span", "u", "← 上り：子 → 親（枝の上）"), el("span", "d", "→ 下り：親 → 子（枝の下）"));
const states = el("div", "states");
for (const [cls, name, how] of [
  ["s-flow", "流れている", "点が進む。最近ほど速く濃い。1 時間を過ぎると止まって薄くなる"],
  ["s-human", "あなたの答え待ち", "柿色。点が矢印の先で止まって脈打つ"],
  ["s-stall", "滞り", "線がくすんで止まる。子の左に ⏸。子の箱がゆっくり点滅"],
  ["s-still", "止めた・済んだ", "動かない細い線。子の左に ■"],

function render() {

app.append(g);

// ---- 作業ごとのようす ----
const cs = el("section", "sec");
cs.append(el("h2", "", "作業ごとのようす"), el("p", "lead", "最後に動いた順。棒は、この 1 時間のやり取りの数（藍は上り、紫は下り、柿は答え待ち）。"));
const cards = el("div", "cards");
const sorted = [...VIEW.nodes].sort((a, b) => Date.parse(b.lastActivityAt) - Date.parse(a.lastActivityAt));
sorted.forEach((n, ci) => {
  const c = el("div", "card" + (n.needsHuman ? " need" : "")); c.id = "card-" + n.id;
  const [sname, scls] = STATE[n.state];
  const head = el("div", "row"); head.append(el("span", "chip " + scls, sname));
  if (n.needsHuman) head.append(el("span", "chip wait", "あなたの答え " + n.needsHuman + " 件"));

  const meta = el("div", "meta");
  meta.append(el("span", "", n.role + (n.parentId ? "（親：" + short(byId[n.parentId].title, 12) + "）" : "（いちばん上）")),
              el("span", "num", "最後の動き " + clock(n.lastActivityAt) + "（" + ago(n.lastActivityAt) + "）"));
  c.append(meta);

  const sp = svgEl("svg", { class: "spark", viewBox: "0 0 240 34" });
  sp.append(svgEl("line", { class: "axis", x1: 0, y1: 33, x2: 240, y2: 33 }));

    bar.style.animationDelay = (ci * 0.08 + slot * 0.03) + "s";
    sp.append(bar);
  }
  c.append(sp);
  const fl = el("ul", "flowlist");
  for (const m of mine.slice(0, 3)) {

    li.append(el("span", "ar " + (m.human ? "h" : up ? "u" : "d"), up ? "↑" : "↓"));
    const body = el("span");

    const b = el("button", "sm", "写す"); b.addEventListener("click", () => { navigator.clipboard?.writeText("claude attach " + n.id); b.textContent = "写しました"; b.classList.add("done"); });

  if (folded) { const d = el("details", "folded"); d.append(el("summary", "", "済んだ作業の知らせ " + folded.length + " 件（たたんでいます）")); const ul = el("ul", "flowlist"); folded.forEach(t => ul.append(el("li", "", t))); d.append(ul); c.append(d); }

cs.append(cards); app.append(cs);
